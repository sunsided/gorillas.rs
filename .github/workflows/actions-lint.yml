name: Workflow lint

# Lint the GitHub Actions workflows themselves: actionlint (syntax, expressions, shellcheck of
# run steps) and zizmor (security: pinning, permissions, injection, credential persistence).
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: actionlint · zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: shellcheck,zizmor

      # install-action has no actionlint; take the release binary, checked against a pinned
      # SHA-256 (bump both together).
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --format plain .github
        env:
          # Lets zizmor resolve action refs (impostor commits, known-vulnerable versions).
          GH_TOKEN: ${{ github.token }}
