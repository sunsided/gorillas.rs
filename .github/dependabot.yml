version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      major-updates:
        update-types:
          - major
      minor-and-patch-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      major-updates:
        update-types:
          - major
      minor-and-patch-updates:
        update-types:
          - minor
          - patch