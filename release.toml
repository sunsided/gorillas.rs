# Config for `cargo release` (https://github.com/crate-ci/cargo-release).
#
# Install once:  cargo install cargo-release --locked
#
#   task release VERSION=0.3.0      (or: cargo release 0.3.0 --execute)
#
# Bumps the version in Cargo.toml and web/package.json, stamps CHANGELOG.md (`## [Unreleased]`
# becomes `## [X.Y.Z] - <date>` under a fresh `[Unreleased]`, compare links updated), commits
# "Release X.Y.Z", tags vX.Y.Z and pushes. The tag runs .github/workflows/release.yml, which
# builds, attests and publishes the GitHub release with that CHANGELOG section as notes, and
# announces it to games.markusmayer.dev. The crate is never published to crates.io.
#
# Dry-run by dropping --execute.

tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
publish = false

# Only release from main.
allow-branch = ["main"]

pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
  { file = "web/package.json", search = "\"version\": \"[^\"]+\"", replace = "\"version\": \"{{version}}\"", exactly = 1 },
]
