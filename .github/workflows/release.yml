# On a version tag (v1.2.3): build the native Linux binary and the browser build, attest
# their build provenance, attach both to a GitHub release for that tag, and announce the
# release to games.markusmayer.dev, which verifies the web zip against SHA256SUMS and the
# attestation before it serves it.
#
# Verify a downloaded artifact with:
#   gh attestation verify gorillas-<tag>-web.zip --repo sunsided/gorillas.rs
#
# The announce job needs the variable GAMES_ANNOUNCE_APP_ID and, in the `games` environment
# (deployments limited to v* tags), the secret GAMES_ANNOUNCE_APP_PRIVATE_KEY: the games
# site's announce app, see its README.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux binary
    # The oldest supported runner, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries (ALSA, udev, D-Bus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="gorillas-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "pkg/$name/fonts"
          cp target/release/gorillas README.md GORILLAS.BAS "pkg/$name/"
          cp fonts/README.md "pkg/$name/fonts/"
          tar -C pkg -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: gorillas-*-linux-x86_64.tar.gz
          if-no-files-found: error

  web:
    name: Web build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release builds from scratch: no cache another workflow could have poisoned.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: web
        run: yarn install --immutable

      - name: Build the game for the web
        working-directory: web
        run: yarn wasm

      # No base path: every URL in the site is relative, so it works from any folder. The
      # games site frames play.html, which is the game alone.
      - name: Build the site
        working-directory: web
        run: yarn build

      - name: Package
        run: |
          name="gorillas-${GITHUB_REF_NAME}-web"
          (cd web/build && zip -r -9 "../../$name.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: gorillas-*-web.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.tar.gz
            out/*.zip

      # Release notes are the tag's CHANGELOG.md section, with hard-wrapped lines joined
      # (GitHub renders single newlines in release bodies as line breaks). Falls back to
      # generated notes when the changelog has no section for this version.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (p) exit; if (index($0, "## [" v "]") == 1) { p = 1; next } }
            /^\[[^]]+\]: / { if (p) exit }
            !p { next }
            /^$/ || /^#/ || /^- / { if (buf != "") print buf; buf = $0; if ($0 == "" || /^#/) { print buf; buf = "" }; next }
            { sub(/^ +/, ""); buf = (buf == "" ? $0 : buf " " $0) }
            END { if (buf != "") print buf }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "QBasic Gorillas $GITHUB_REF_NAME" \
            "${notes[@]}" \
            --verify-tag

  announce:
    name: Announce to games.markusmayer.dev
    needs: [release]
    permissions: {}
    # Runs in this repository's `games` environment (limited to v* tags), which holds the
    # announce app's GAMES_ANNOUNCE_APP_PRIVATE_KEY; nothing is passed from here.
    uses: sunsided/games.markusmayer.dev/.github/workflows/announce.yml@1a9fcc9797ccb7d395e141f93e43f9fefdc33cdd # announce-v1.1.0
    with:
      app-id: ${{ vars.GAMES_ANNOUNCE_APP_ID }}
